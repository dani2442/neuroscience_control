[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroscience-control"
dynamic = ["version"]
description = "Brain dynamics simulation and control with Coupled Hopf and Neural SDE models"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel López Montero", email = "dani.lopez@fau.de" },
    { name = "Xenia Kobeleva", email = "research@xenia-kobeleva.com" },
    { name = "Lorenzo Liverani", email = "lorenzo.liverani@fau.de" },
]
keywords = ["neuroscience", "fMRI", "SDE", "Hopf", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "nbconvert>=7.17.1",
    "nibabel>=5.0",
    "nilearn>=0.10",
    "numpy>=1.26",
    "plotly>=5.20",
    "pyriemann>=0.10",
    "scikit-learn>=1.8.0",
    "scipy>=1.11",
    "seaborn>=0.13.2",
    "torch>=2.2",
    "torchsde>=0.2.6",
    "tqdm>=4.66",
    "umap-learn>=0.5.11",
    "wandb>=0.16",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "twine>=6.1",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
]
datasets = [
    "openneuro-py>=2026.3.0",
    "datalad>=1.3",
]
exp_design = [
    "cvxpy>=1.6",
]

[project.urls]
Homepage = "https://github.com/dani2442/neuroscience_control"
Repository = "https://github.com/dani2442/neuroscience_control"
Issues = "https://github.com/dani2442/neuroscience_control/issues"
Documentation = "https://dani2442.github.io/neuroscience_control/"

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "neuroscience_control*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src", "neuroscience_control"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.uv.sources]
torchsde = { git = "https://github.com/dani2442/torchsde" }

[dependency-groups]
dev = [
    "arxiv-to-prompt>=0.13.2",
    "build>=1.2",
    "ipykernel>=7.2.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "scienceplots>=2.2.1",
    "twine>=6.1",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
]
datasets = [
    "openneuro-py>=2026.3.0",
    "datalad>=1.3",
]
