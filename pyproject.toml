[project]
name = "neuroscience-control"
version = "0.1.0"
description = "Brain dynamics simulation and control using Coupled Hopf and Neural SDE models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "scipy>=1.15.0",
    "torch>=2.10.0",
    "torchsde",
    "tqdm>=4.67.2",
    "wandb>=0.24.1",
]

[tool.uv.sources]
torchsde = { git = "https://github.com/dani2442/torchsde" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
