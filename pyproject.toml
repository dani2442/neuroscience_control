[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroscience-modeling"
dynamic = ["version"]
description = "Hybrid generative whole-brain models (Coupled Hopf, Neural SDE, hybrid) fitted by gradient descent"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel López Montero", email = "dani.lopez@fau.de" },
    { name = "Xenia Kobeleva", email = "research@xenia-kobeleva.com" },
    { name = "Lorenzo Liverani", email = "lorenzo.liverani@fau.de" },
]
keywords = ["neuroscience", "fMRI", "SDE", "Hopf", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "nibabel>=5.0",
    "nilearn>=0.10",
    "numpy>=1.26",
    "plotly>=5.20",
    "pyriemann>=0.10",
    "scikit-learn>=1.8.0",
    "scipy>=1.11",
    "seaborn>=0.13.2",
    "torch>=2.2",
    "torchsde>=0.2.6",
    "tqdm>=4.66",
    "umap-learn>=0.5.11",
    "wandb>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
]
datasets = [
    "openneuro-py>=2026.3.0",
    "datalad>=1.3",
]

[project.urls]
Homepage = "https://github.com/DCN-FAU-AvH/neuroscience-modeling"
Repository = "https://github.com/DCN-FAU-AvH/neuroscience-modeling"
Issues = "https://github.com/DCN-FAU-AvH/neuroscience-modeling/issues"
Documentation = "https://dcn-fau-avh.github.io/neuroscience-modeling/"

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# Scripts and tests insert the repository root into sys.path before importing `src`.
"examples/*.py" = ["E402"]
"tests/*.py" = ["E402"]
# Analysis notebooks: allow compact plotting idioms.
"*.ipynb" = ["E402", "E701", "E702", "E703", "E741", "F811", "F841"]

[tool.uv.sources]
torchsde = { git = "https://github.com/dani2442/torchsde" }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "scienceplots>=2.2.1",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
]
datasets = [
    "openneuro-py>=2026.3.0",
    "datalad>=1.3",
]
