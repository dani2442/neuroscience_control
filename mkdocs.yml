site_name: Neuroscience Control
site_description: Whole-brain dynamics simulation and control with Hopf and Neural SDE models.
site_url: https://dani2442.github.io/neuroscience_control/
repo_url: https://github.com/dani2442/neuroscience_control
repo_name: dani2442/neuroscience_control

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Project Structure: getting-started/project-structure.md
  - Tutorials:
      - First Training Run: tutorials/first-training-run.md
      - Metrics Evaluation: tutorials/metrics-evaluation.md
  - API Overview: api/index.md
  - Website Deployment: website.md
  - Publishing: publishing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences
  - toc:
      permalink: true
